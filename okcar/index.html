<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>OKCAR — Vistoria e pré-cautelar</title>
<meta name="description" content="OKCAR: vistoria completa com fotos, checklist de estrutura e pintura, consulta veicular por placa e laudo em PDF.">
<meta name="theme-color" content="#0d0f12">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='11' fill='%23bdf24d'/%3E%3Cpath d='m11 21 7 7 12-15' stroke='%230d0f12' stroke-width='4.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f12;--s1:#14181d;--s2:#1b2027;--s3:#232a32;--line:rgba(255,255,255,.09);--fg:#f2f4f6;--mut:#98a2ac;--acc:#bdf24d;--acci:#0d0f12;--bad:#ff5d5d;--warn:#ffb21f;--ok:#39d98a;--blue:#4da3ff;--r:14px;--shadow:0 18px 50px rgba(0,0,0,.35)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f1f2ee;--s1:#fff;--s2:#eceee8;--s3:#e1e4dc;--line:rgba(13,15,18,.11);--fg:#13171c;--mut:#5b656f;--acc:#2f9e44;--acci:#fff;--shadow:0 18px 50px rgba(20,30,20,.12)}}
:root[data-theme="light"]{--bg:#f1f2ee;--s1:#fff;--s2:#eceee8;--s3:#e1e4dc;--line:rgba(13,15,18,.11);--fg:#13171c;--mut:#5b656f;--acc:#2f9e44;--acci:#fff;--shadow:0 18px 50px rgba(20,30,20,.12)}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
body{background:var(--bg);color:var(--fg);font:16px/1.55 Inter,system-ui,sans-serif;min-height:100vh}
h1,h2,h3{font-family:Unbounded,Inter,sans-serif;letter-spacing:-.02em;line-height:1.15;font-weight:600}
h1{font-size:clamp(22px,3.4vw,30px)}h2{font-size:18px}h3{font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:22px 16px;border-right:1px solid var(--line);background:var(--s1);display:flex;flex-direction:column;gap:6px}
.brand{font-family:Unbounded,Inter,system-ui,sans-serif;display:flex;align-items:center;gap:10px;padding:4px 8px 22px;font-weight:700;font-size:20px;letter-spacing:-.03em;text-decoration:none}
.brand svg{width:34px;height:34px}
.nav a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;color:var(--mut);text-decoration:none;font-weight:500;min-height:44px}
.nav a:hover{background:var(--s2);color:var(--fg)}
.nav a.on{background:var(--s3);color:var(--fg)}
.nav a.on svg{color:var(--acc)}
.side .foot{margin-top:auto;font-size:12px;color:var(--mut);padding:8px}
.main{padding:30px clamp(16px,4vw,44px) 120px;max-width:1200px;width:100%}
.bnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--s1);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
.bnav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mut);text-decoration:none;padding:6px 14px;min-width:64px;min-height:48px;border-radius:12px;font-weight:500}
.bnav a.on{color:var(--fg)}.bnav a.on svg{color:var(--acc)}
.bnav a.plus{background:var(--acc);color:var(--acci);border-radius:16px;margin-top:-18px;box-shadow:var(--shadow)}
.bnav a.plus.on,.bnav a.plus:hover{color:var(--acci)}.bnav a.plus svg{color:var(--acci)!important}
@media(max-width:899px){.app{display:block}.side{display:none}.bnav{display:flex}.main{padding-top:20px}}
.top{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:22px}
.top p{color:var(--mut);margin-top:6px;font-size:14px}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;background:var(--s3);font-weight:600;font-size:14px;border:1px solid var(--line);transition:transform .12s,background .15s;white-space:nowrap}
.btn:hover{background:var(--s2)}.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acc);color:var(--acci);border-color:transparent}.btn.pri:hover{filter:brightness(1.06);background:var(--acc)}
.btn.bad{color:var(--bad)}.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn[disabled]{opacity:.5;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card+.card{margin-top:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stat b{display:block;font:600 26px Unbounded,Inter,system-ui,sans-serif;letter-spacing:-.03em;margin-top:4px}
.stat span{font-size:13px;color:var(--mut)}
.filters{display:grid;grid-template-columns:1fr 180px 160px;gap:10px;margin-bottom:14px}
@media(max-width:700px){.filters{grid-template-columns:1fr}}
.inp,.fld input,.fld select,.fld textarea{width:100%;min-height:46px;padding:10px 14px;border-radius:12px;background:var(--s2);border:1px solid var(--line);outline:0;font-size:16px}
.fld textarea{min-height:130px;resize:vertical}
.inp:focus,.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
.fld{display:flex;flex-direction:column;gap:6px}
.fld>span{font-size:12px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr 1fr}.g1m{grid-template-columns:1fr}}
.span2{grid-column:span 2}
.list{display:flex;flex-direction:column;gap:10px}
.vrow{display:grid;grid-template-columns:92px 170px 1.2fr 1.4fr 140px 100px;gap:12px;align-items:center;padding:14px 16px;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;text-decoration:none}
.vrow:hover{border-color:color-mix(in srgb,var(--acc) 50%,var(--line))}
.vrow .pl{font:600 15px Unbounded,Inter,system-ui,sans-serif;letter-spacing:.02em}
.vrow small{display:block;color:var(--mut);font-size:12.5px}
@media(max-width:860px){.vrow{grid-template-columns:1fr auto;gap:6px 10px}.vrow>:nth-child(n+3){grid-column:1/-1}}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid transparent;white-space:nowrap}
.b-ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.b-warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.b-bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.b-mut{background:var(--s3);color:var(--mut)}
.demo{font-size:10px;font-weight:700;letter-spacing:.08em;padding:2px 6px;border-radius:6px;background:var(--s3);color:var(--mut);margin-left:6px;vertical-align:middle}
.empty{text-align:center;padding:48px 18px;color:var(--mut)}
.empty h3{color:var(--fg);margin-bottom:8px}
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.steps button{flex:none;display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:12px;background:var(--s1);border:1px solid var(--line);color:var(--mut);font-weight:600;font-size:14px}
.steps button b{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--s3);font-size:12px}
.steps button.on{color:var(--fg);border-color:var(--acc)}.steps button.on b{background:var(--acc);color:var(--acci)}
.steps button.done b{background:color-mix(in srgb,var(--ok) 25%,transparent);color:var(--ok)}
.sec{margin-bottom:22px}.sec>h3{margin-bottom:12px}
.hint{font-size:13px;color:var(--mut)}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:900px){.slots{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.slots{grid-template-columns:repeat(2,1fr)}}
.slot{position:relative;aspect-ratio:4/3;border-radius:12px;border:1.5px dashed var(--line);background:var(--s2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--mut);font-size:13px;font-weight:600;text-align:center;padding:8px;overflow:hidden}
.slot.has{border-style:solid;padding:0}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot .cap{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 6px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-size:12px;text-align:left}
.slot .x{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;display:grid;place-items:center}
.diag{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:18px;align-items:start}
@media(max-width:800px){.diag{grid-template-columns:1fr}}
.diag svg.car{width:100%;max-width:320px;margin:0 auto;display:block}
.diag [data-part]{cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12.5px;color:var(--mut);margin-bottom:12px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.prow{display:grid;grid-template-columns:30px 1fr 130px 84px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border:0}
.prow .n{width:26px;height:26px;border-radius:50%;background:var(--s3);display:grid;place-items:center;font-size:12px;font-weight:700}
.prow select,.prow input{min-height:40px;padding:6px 10px;border-radius:10px;background:var(--s2);border:1px solid var(--line);font-size:16px;width:100%}
@media(max-width:520px){.prow{grid-template-columns:30px 1fr 1fr}.prow input{grid-column:2/-1}}
.grp{margin-bottom:18px}.grp h3{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;font-family:Inter;font-weight:700}
.erow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.erow:last-child{border:0}
.seg{display:flex;background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:3px;flex:none}
.seg button{min-height:36px;padding:0 12px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--mut)}
.seg button.on[data-st=na]{background:var(--s3);color:var(--fg)}
.seg button.on[data-st=ok],.seg button.on[data-st=nc]{background:var(--ok);color:#06140c}
.seg button.on[data-st=ap],.seg button.on[data-st=pos]{background:var(--bad);color:#1a0505}
.chk{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:700px){.chk{grid-template-columns:1fr}}
.chk .fld select{min-height:42px}
.nav2{display:flex;justify-content:space-between;gap:10px;margin-top:22px;position:sticky;bottom:70px}
@media(min-width:900px){.nav2{bottom:12px}}
.sticky{background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);padding:10px 0}
.kv{display:grid;grid-template-columns:minmax(96px,140px) 1fr;gap:6px 14px;font-size:14.5px}.kv dt{color:var(--mut)}.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.score{display:flex;align-items:center;gap:14px}
.score .L{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;font:700 26px Unbounded,Inter,system-ui,sans-serif;color:#0d0f12}
.sA{background:var(--ok)}.sB{background:#a6e04a}.sC{background:var(--warn)}.sD{background:var(--bad)}.sN{background:var(--s3);color:var(--mut)!important}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.thumbs figure{position:relative;aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:var(--s2)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs figcaption{position:absolute;left:0;right:0;bottom:0;padding:14px 8px 5px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-size:11.5px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.note{font-size:13px;color:var(--mut);background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.prod{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.prod:last-child{border:0}.prod small{display:block;color:var(--mut)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}table.t td{padding:6px 0;border-bottom:1px solid var(--line);vertical-align:top}table.t td:first-child{color:var(--mut);width:42%;padding-right:10px}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.side,.bnav,.top .row,.nav2{display:none!important}.app{display:block}body{background:#fff;color:#000}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <a class="brand" href="#/"><span id="logoMark"></span>OKCAR</a>
    <nav class="nav" id="nav"></nav>
    <div class="foot">Pré-avaliação técnica de veículos<br>Dados salvos neste aparelho</div>
  </aside>
  <main class="main"><div id="view"></div></main>
</div>
<nav class="bnav" id="bnav"></nav>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script>
'use strict';
/* ============ utilidades ============ */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=n=>Number(String(n??'').replace(',','.'))||0;
const brl=n=>num(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const get=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o);
const set=(o,p,v)=>{const k=p.split('.');let a=o;k.slice(0,-1).forEach(x=>a=a[x]=a[x]||{});a[k[k.length-1]]=v};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fdate=t=>new Date(t).toLocaleDateString('pt-BR');
const fdt=t=>new Date(t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let toastT;const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600)};
const IC={grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/>',plus:'<path d="M12 5v14M5 12h14"/>',layers:'<path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/>',cog:'<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',cam:'<path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/>',check:'<path d="m5 12 5 5 9-10"/>',down:'<path d="M12 4v11m-5-4 5 5 5-5M5 20h14"/>',search:'<circle cx="11" cy="11" r="6"/><path d="m20 20-4-4"/>',trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',x:'<path d="M6 6l12 12M18 6 6 18"/>',shield:'<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/>',left:'<path d="m15 6-6 6 6 6"/>',right:'<path d="m9 6 6 6-6 6"/>',print:'<path d="M7 9V4h10v5M7 17H4v-6h16v6h-3M7 14h10v6H7z"/>'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;
$('#logoMark').innerHTML='<svg viewBox="0 0 40 40" width="34" height="34"><rect width="40" height="40" rx="11" fill="var(--acc)"/><path d="m11 21 7 7 12-15" stroke="var(--acci)" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* ============ banco local (IndexedDB) ============ */
const DB={db:null,mem:[],async open(){try{await new Promise((ok,er)=>{const r=indexedDB.open('okcar',1);r.onupgradeneeded=()=>r.result.createObjectStore('v',{keyPath:'id'});r.onsuccess=()=>{this.db=r.result;ok()};r.onerror=()=>er(r.error)})}catch(e){this.db=null}},
tx(m){return this.db.transaction('v',m).objectStore('v')},
all(){if(!this.db)return Promise.resolve(this.mem.slice());return new Promise(ok=>{const r=this.tx('readonly').getAll();r.onsuccess=()=>ok(r.result||[]);r.onerror=()=>ok([])})},
put(v){if(!this.db){const i=this.mem.findIndex(x=>x.id===v.id);i<0?this.mem.push(v):this.mem[i]=v;return Promise.resolve()}return new Promise(ok=>{const r=this.tx('readwrite').put(v);r.onsuccess=r.onerror=()=>ok()})},
del(id){if(!this.db){this.mem=this.mem.filter(x=>x.id!==id);return Promise.resolve()}return new Promise(ok=>{const r=this.tx('readwrite').delete(id);r.onsuccess=r.onerror=()=>ok()})}};

/* ============ dados fixos ============ */
const ST_P=[['na','Não avaliado','#7c8791'],['nc','Nada consta','#39d98a'],['rec','Recuperado','#4da3ff'],['rep','Reparado','#ff8a3d'],['rpt','Repintado','#ffd23f'],['av','Avariado','#ff5d5d']];

function notaP(v){const ps=PARTS.filter(p=>(v.pintura?.[p.id]?.st||'na')!=='na');if(!ps.length)return null;const ok=ps.filter(p=>v.pintura[p.id].st==='nc').length;const pc=Math.round(ok/ps.length*100);return{pc,n:ps.length,cls:pc>=92?'A':pc>=77?'B':pc>=54?'C':'D'}}
function notaE(v){const it=ITENS.filter(i=>(v.estrutura?.[i.id]||'na')!=='na');if(!it.length)return null;const ap=it.filter(i=>v.estrutura[i.id]==='ap').length;return{ap,n:it.length,cls:ap===0?'A':ap<=2?'B':ap<=5?'C':'D'}}
function sugestao(v){const p=notaP(v),e=notaE(v);const pos=CONSULTAS.filter(c=>v.consultas?.[c[0]]==='pos').length;if((p&&p.cls==='D')||(e&&e.cls==='D')||(v.consultas?.roubo==='pos')||(v.consultas?.sinistro==='pos'))return'Não recomendado';if((p&&p.cls==='C')||(e&&e.cls==='C')||pos>0||(e&&e.ap>0))return'Com ressalvas';return(p||e)?'Recomendado':''}

/* ============ API de consulta (via servidor) ============ */
async function api(action,data={}){try{const r=await fetch('/api/okcar?action='+action+(data.id?'&id='+encodeURIComponent(data.id):''),{method:'POST',headers:{'Content-Type':'application/json','x-okcar-pin':S.cfg.pin||''},body:JSON.stringify(data)});const j=await r.json().catch(()=>({}));return{ok:r.ok,status:r.status,j}}catch(e){return{ok:false,status:0,j:{detail:'Sem conexão com o servidor de consulta.'}}}}
const MSG={sem_chave:'A chave da API de consulta ainda não foi configurada no servidor.',pin_invalido:'PIN inválido. Informe o PIN correto em Configurações.',insufficient_balance:'Saldo insuficiente na conta da API de consulta.',placa_invalida:'Placa inválida.',service_unavailable:'Serviço de consulta fora do ar agora. Nada foi cobrado.'};
const erroApi=r=>MSG[r.j.code]||r.j.detail||'Não foi possível consultar agora.';

/* ============ fotos ============ */
function comprimir(file,max=1400,q=.78){return new Promise((ok,er)=>{const fr=new FileReader();fr.onerror=er;fr.onload=()=>{const im=new Image();im.onerror=er;im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const w=Math.round(im.width*k),h=Math.round(im.height*k);const c=document.createElement('canvas');c.width=w;c.height=h;const cx=c.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,w,h);cx.drawImage(im,0,0,w,h);ok({s:c.toDataURL('image/jpeg',q),w,h})};im.src=fr.result};fr.readAsDataURL(file)})}
function escolherFoto(cb){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=async()=>{if(!i.files[0])return;try{cb(await comprimir(i.files[0]))}catch(e){toast('Não consegui ler essa foto.')}};i.click()}

function render(){nav();const [,a,b]=('/'+(location.hash.slice(2)||'')).split('/');const keep=window.scrollY;
  if(a==='nova'){if(!S.cur||!S.editNew){S.cur=novo();S.step=0;S.editNew=true}view.innerHTML=telaEditor()}
  else if(a==='editar'){const v=S.list.find(x=>x.id===b);if(!v){view.innerHTML=telaNaoEncontrada();return}if(!S.cur||S.cur.id!==b){S.cur=v;S.step=0}S.editNew=false;view.innerHTML=telaEditor()}
  else if(a==='v'){const v=S.list.find(x=>x.id===b);view.innerHTML=v?telaDetalhe(v):telaNaoEncontrada()}
  else if(a==='lotes'){S.cur=null;view.innerHTML=telaLotes()}
  else if(a==='config'){S.cur=null;view.innerHTML=telaConfig()}
  else{S.cur=null;view.innerHTML=telaPainel()}
  if(a!=='nova'&&a!=='editar')S.editNew=false;
  window.scrollTo(0,keep)}
window.addEventListener('hashchange',()=>{salvar(true);window.scrollTo(0,0);render()});
const rerenderStep=()=>{const k=window.scrollY;$('#stepbody').innerHTML=[stepDados,stepConsultas,stepFotos,stepPintura,stepEstrutura,stepParecer][S.step]();window.scrollTo(0,k);document.querySelectorAll('.steps button').forEach((b,i)=>{b.classList.toggle('on',i===S.step)})};

/* ============ eventos ============ */
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.f&&S.cur){let v=t.value;if(t.dataset.f==='veiculo.placa'){v=v.toUpperCase().replace(/[^A-Z0-9]/g,'');t.value=v}if(t.dataset.f==='veiculo.chassi'){v=v.toUpperCase();t.value=v}set(S.cur,t.dataset.f,v);salvar();
    if(/^pintura\./.test(t.dataset.f)&&t.dataset.f.endsWith('.st')){const d=$('#dg');if(d)d.firstElementChild.outerHTML=diagram(S.cur)}}
  else if(t.dataset.extra!==undefined&&S.cur){S.cur.extras[t.dataset.extra].t=t.value;salvar()}
  else if(t.dataset.cfg){S.cfg[t.dataset.cfg]=t.value;lsSet('okcar_cfg',S.cfg)}
  else if(t.id==='fq'){S.f.q=t.value;const p=t.selectionStart;view.innerHTML=telaPainel();const n=$('#fq');n.focus();n.setSelectionRange(p,p)}
  else if(t.id==='fr'){S.f.res=t.value;view.innerHTML=telaPainel()}else if(t.id==='fp'){S.f.per=t.value;view.innerHTML=telaPainel()}
  else if(t.dataset.sel){t.checked?S.sel.add(t.dataset.sel):S.sel.delete(t.dataset.sel);const b=$('[data-act=criarlote]');if(b){b.disabled=!S.sel.size;b.lastChild.textContent='Criar lote com '+(S.sel.size||'')+' selecionada(s)'}}});
document.addEventListener('click',async e=>{
  const pt=e.target.closest('[data-part]');if(pt&&S.cur){const id=pt.dataset.part;const ord=ST_P.map(s=>s[0]);const cur=S.cur.pintura[id]?.st||'na';set(S.cur,'pintura.'+id+'.st',ord[(ord.indexOf(cur)+1)%ord.length]);salvar();rerenderStep();return}
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,v=S.cur;
  if(a==='step'){S.step=+b.dataset.i;salvar(true);render();window.scrollTo(0,0)}
  else if(a==='next'||a==='prev'){S.step+=a==='next'?1:-1;salvar(true);render();window.scrollTo(0,0)}
  else if(a==='sair'){salvar(true);toast('Vistoria salva');setTimeout(()=>location.hash='#/',150)}
  else if(a==='concluir'){if(!v.veiculo.placa&&!confirm('A vistoria está sem placa. Concluir mesmo assim?'))return;if(!v.resultado)v.resultado=sugestao(v)||'Com ressalvas';v.concluida=true;salvar(true);S.cur=null;S.editNew=false;toast('Vistoria concluída');location.hash='#/v/'+v.id}
  else if(a==='foto'){escolherFoto(r=>{v.fotos[b.dataset.k]=r;salvar();rerenderStep()})}
  else if(a==='rmfoto'){e.stopPropagation();delete v.fotos[b.dataset.k];salvar();rerenderStep()}
  else if(a==='extra'){escolherFoto(r=>{v.extras.push({...r,t:''});salvar();rerenderStep()})}
  else if(a==='rmextra'){v.extras.splice(+b.dataset.i,1);salvar();rerenderStep()}
  else if(a==='pall'){PARTS.forEach(p=>set(v,'pintura.'+p.id+'.st','nc'));salvar();rerenderStep()}
  else if(a==='eall'){ITENS.forEach(i=>v.estrutura[i.id]='ok');salvar();rerenderStep()}
  else if(a==='est'){v.estrutura[b.dataset.id]=b.dataset.st;salvar();rerenderStep()}
  else if(a==='buscar')buscarPlaca();
  else if(a==='produtos')carregarProdutos();
  else if(a==='pedir')pedirRelatorio(b.dataset);
  else if(a==='pdf'){const x=S.list.find(i=>i.id===b.dataset.id);S.busy.pdf=true;b.disabled=true;try{await gerarLaudo(x)}catch(err){console.error(err);toast('Não consegui gerar o PDF. Verifique a conexão e tente de novo.')}S.busy.pdf=false;if(location.hash.startsWith('#/v/'))render()}
  else if(a==='excluir'){if(confirm('Excluir esta vistoria? Não dá para desfazer.')){await DB.del(b.dataset.id);S.list=S.list.filter(x=>x.id!==b.dataset.id);toast('Vistoria excluída');location.hash='#/'}}
  else if(a==='criarlote'){const d=new Date(),k='okcar_'+String(d.getDate()).padStart(2,'0')+String(d.getMonth()+1).padStart(2,'0')+d.getFullYear()+'_'+(Object.keys(S.list.reduce((m,x)=>(x.lote&&(m[x.lote]=1),m),{})).length+1);for(const x of S.list)if(S.sel.has(x.id)){x.lote=k;await DB.put(x)}S.sel.clear();toast('Lote criado');render()}
  else if(a==='desfazer'){if(confirm('Desfazer este lote? As vistorias voltam para a lista.'))for(const x of S.list)if(x.lote===b.dataset.l){x.lote='';await DB.put(x)}render()}
  else if(a==='lotepdf')lotePdf(b.dataset.l);
  else if(a==='logo')escolherFoto(r=>{S.cfg.logo=r.s;lsSet('okcar_cfg',S.cfg);render()});
  else if(a==='rmlogo'){S.cfg.logo='';lsSet('okcar_cfg',S.cfg);render()}
  else if(a==='exp'){const bl=new Blob([JSON.stringify({v:1,list:S.list,cfg:{...S.cfg,pin:''}})],{type:'application/json'});const u=URL.createObjectURL(bl);const l=document.createElement('a');l.href=u;l.download='okcar-backup-'+new Date().toISOString().slice(0,10)+'.json';l.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
  else if(a==='imp'){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=async()=>{try{const j=JSON.parse(await i.files[0].text());for(const x of j.list||[]){await DB.put(x)}S.list=await DB.all();toast('Backup importado');render()}catch(err){toast('Arquivo de backup inválido')}};i.click()}
  else if(a==='rmdemo'){for(const x of S.list.filter(v=>v.demo))await DB.del(x.id);S.list=S.list.filter(v=>!v.demo);toast('Exemplos removidos');render()}});

/* ============ consultas ============ */
async function buscarPlaca(){const v=S.cur,pl=(v.veiculo.placa||'').toUpperCase();if(pl.length<7){toast('Digite a placa completa');return}S.busy.buscar=true;rerenderStep();
  const r=await api('consulta',{placa:pl});S.busy.buscar=false;
  if(r.ok&&r.j.object==='lookup'){v.consulta=r.j;if(r.j.result==='found'){const x=r.j.vehicle,m=v.veiculo,sf=(k,val)=>{if(val!=null&&val!==''&&!m[k])m[k]=String(val)};sf('marca',x.brand);sf('modelo',x.model);sf('versao',x.version);sf('anoFab',x.manufacture_year);sf('anoMod',x.model_year);sf('cor',x.color);sf('comb',x.fuel);sf('cidade',x.city);sf('uf',x.state);v.consultas.roubo=x.theft?'pos':'nc';toast('Dados preenchidos pela placa')}else toast('Placa sem cadastro na base')}
  else toast(erroApi(r));salvar(true);render()}
async function carregarProdutos(){S.busy.produtos=true;rerenderStep();const r=await api('produtos');S.busy.produtos=false;if(r.ok)S.prods=(r.j.data||[]).filter(p=>p.type==='report');else toast(erroApi(r));rerenderStep()}
async function pedirRelatorio(d){const v=S.cur,pl=(v.veiculo.placa||'').toUpperCase();if(pl.length<7){toast('Preencha a placa antes');return}if(!confirm(`Pedir "${d.n}" para ${pl}?\nSerá cobrado ${brl(d.v)} do saldo da conta de consulta.`))return;
  S.busy['r'+d.p]=true;rerenderStep();const r=await api('relatorio',{placa:pl,produto:d.p});S.busy['r'+d.p]=false;
  if(!(r.ok&&r.j.id)){if(r.status===409&&r.j.report?.id){}else{toast(erroApi(r));rerenderStep();return}}
  const id=r.j.id||r.j.report.id;v.relatorios[d.p]={id,nome:d.n,status:'queued',result:null};salvar(true);rerenderStep();acompanhar(v,d.p)}
async function acompanhar(v,k){for(let i=0;i<30;i++){await new Promise(o=>setTimeout(o,i<3?4000:10000));const r=await api('relatorio_status',{id:v.relatorios[k].id});if(r.ok&&(r.j.status==='completed'||r.j.status==='failed')){v.relatorios[k].status=r.j.status;v.relatorios[k].result=r.j.result||null;if(r.j.status==='failed')toast('Sem dados para esta placa. Valor devolvido.');else toast('Relatório pronto');await DB.put(v);if(S.cur&&S.cur.id===v.id&&S.step===1)rerenderStep();return}}}
function flat(o,p='',d=0,out=[]){if(o==null)return out;if(typeof o!=='object'){out.push([p,String(o)]);return out}if(Array.isArray(o)){if(o.every(x=>typeof x!=='object'))out.push([p,o.join(', ')]);else o.slice(0,20).forEach((x,i)=>flat(x,p+'['+(i+1)+']',d+1,out));return out}if(d>3)return out;Object.entries(o).forEach(([k,x])=>flat(x,p?p+' › '+k:k,d+1,out));return out}

/* ============ PDF do laudo ============ */
const C={dark:[13,15,18],acc:[189,242,77],fg:[24,28,33],mut:[110,118,126],line:[222,226,220],ok:[39,160,98],bad:[220,60,60],warn:[222,150,20],soft:[244,245,242]};
const rgbSt=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
async function gerarLaudo(v){
  const J=window.jspdf&&window.jspdf.jsPDF;if(!J){toast('A biblioteca de PDF ainda não carregou. Aguarde um instante e tente de novo.');return}
  const doc=new J({unit:'mm',format:'a4'});const W=210,H=297,M=14;const cfg=S.cfg;let y=0;
  const T=(t,x,yy,o={})=>{doc.setFont('helvetica',o.b?'bold':'normal');doc.setFontSize(o.s||10);doc.setTextColor(...(o.c||C.fg));doc.text(String(t),x,yy,{align:o.a||'left',maxWidth:o.w})};
  const R=(x,yy,w,h,c,r=0)=>{doc.setFillColor(...c);r?doc.roundedRect(x,yy,w,h,r,r,'F'):doc.rect(x,yy,w,h,'F')};
